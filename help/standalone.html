<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconize Help</title>
  <style>
    :root { color-scheme: light dark; font: 100%/1.6 system-ui, sans-serif; }
    body { max-width: 56rem; margin: auto; padding: 1.5rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-block: 1rem; }
    [aria-current="page"] { font-weight: 700; }
    h1, h2, h3, h4 { line-height: 1.25; }
    h4 { margin-block-end: 0.5rem; }
    figure { margin: 1rem 0; }
    img { display: block; max-width: 100%; height: auto; }
    figcaption { font-size: 0.9rem; margin-block-start: 0.5rem; }
    .tech { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Reconize Help</h1>
    <p><a href="/">Open Reconize</a> or <a href="/login">sign in</a> directly. The guide also describes the optional MICE Hub integration.</p>
    <nav aria-label="Guide language">{{languages}}</nav>
  </header>
  <main>{{guide}}</main>
</body>
</html>
